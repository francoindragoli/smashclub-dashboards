<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rentabilidad Joven Deli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--am:#e8b84b;--vl:#2d5a1b;--vd:#6ebd89;--bg:#0b130a;--sf:#121f0f;--sf2:#1a2e15;--bd:#2a4020;--tx:#e4eee2;--mt:#6a8a60;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;}
.hdr{background:var(--vl);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:3px solid var(--am);}
.logo-t{font-family:'Passion One',sans-serif;font-weight:700;font-size:28px;color:#fff;letter-spacing:1px;line-height:1;}
.logo-t span{color:var(--am);}
.logo-s{font-family:'Passion One',sans-serif;font-weight:400;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.45);text-transform:uppercase;margin-top:2px;}
.kpis{display:flex;gap:10px;flex-wrap:wrap;}
.kpi{text-align:center;background:rgba(0,0,0,.25);border-radius:8px;padding:7px 12px;border:1px solid rgba(255,255,255,.08);}
.kv{font-family:'Passion One',sans-serif;font-weight:700;font-size:24px;line-height:1;}
.kv.am{color:var(--am);} .kv.vd{color:var(--vd);} .kv.wh{color:#fff;}
.kl{font-size:9px;color:rgba(255,255,255,.4);margin-top:2px;text-transform:uppercase;letter-spacing:.8px;}
.hm{font-size:10px;color:rgba(255,255,255,.28);text-align:right;line-height:1.7;}
.tabs{display:flex;background:var(--sf);border-bottom:2px solid var(--bd);padding:0 12px;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{padding:10px 14px;cursor:pointer;font-family:'Passion One',sans-serif;font-weight:400;font-size:13px;letter-spacing:1px;color:var(--mt);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;text-transform:uppercase;white-space:nowrap;}
.tab.active{color:var(--am);border-bottom-color:var(--am);}
.tab:hover:not(.active){color:var(--tx);}
.panel{display:none;padding:12px;}
.panel.active{display:block;}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.cgrid.one{grid-template-columns:1fr;}
.cc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;height:240px;}
@media(max-width:640px){.cgrid{grid-template-columns:1fr;}.cc{height:200px;}}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;border:1px solid var(--bd);}
table{width:100%;border-collapse:collapse;min-width:600px;}
thead th{background:var(--sf2);color:var(--mt);font-family:'Passion One',sans-serif;font-weight:400;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:9px 10px;text-align:right;border-bottom:2px solid var(--am);white-space:nowrap;}
thead th:first-child{text-align:left;position:sticky;left:0;background:var(--sf2);z-index:1;}
td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle;}
td:first-child{text-align:left;font-weight:600;color:#fff;position:sticky;left:0;background:var(--bg);z-index:1;}
tr:hover td{background:var(--sf2);}
tr:hover td:first-child{background:var(--sf2);}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-family:'Passion One',sans-serif;font-weight:400;font-size:13px;letter-spacing:.5px;}
.bvd{background:rgba(110,189,137,.15);color:var(--vd);border:1px solid rgba(110,189,137,.3);}
.bam{background:rgba(232,184,75,.12);color:var(--am);border:1px solid rgba(232,184,75,.25);}
.brj{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.25);}
.rb{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;}
.rt{background:var(--bd);border-radius:3px;height:6px;width:50px;overflow:hidden;}
.rf{height:100%;border-radius:3px;}
.nota{font-size:10px;color:var(--mt);font-style:italic;}
.nm{color:var(--mt);} .nw{color:#fff;font-weight:600;} .nv{color:var(--vd);} .na{color:var(--am);}
@media(max-width:480px){.logo-t{font-size:22px;}.kpis{gap:6px;}.kv{font-size:20px;}.hdr{padding:10px 12px;}.panel{padding:8px;}}
.back-link{font-size:11px;color:var(--mt);text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin:8px 12px;opacity:.7;}
.back-link:hover{opacity:1;color:var(--am);}
/* Modal receta */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center;padding:12px;}
.modal-overlay.open{display:flex;}
.modal{background:#1a2e15;border:1px solid var(--bd);border-radius:16px;width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6);}
.modal-hdr{background:var(--vl);padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--am);flex-shrink:0;}
.modal-title{font-family:'Passion One',sans-serif;font-weight:700;font-size:26px;color:#fff;letter-spacing:1px;line-height:1;}
.modal-close{background:none;border:none;color:rgba(255,255,255,.45);font-size:26px;cursor:pointer;padding:0 4px;line-height:1;border-radius:6px;transition:.15s;flex-shrink:0;}
.modal-close:hover{color:#fff;background:rgba(255,255,255,.1);}
.modal-body{overflow-y:auto;padding:16px;}
.modal-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.modal-kpi{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-align:center;}
.modal-kv{font-family:'Passion One',sans-serif;font-weight:700;font-size:22px;line-height:1;}
.modal-kl{font-size:9px;color:var(--mt);text-transform:uppercase;letter-spacing:.9px;margin-top:3px;}
.rec-table{width:100%;border-collapse:collapse;font-size:12px;min-width:480px;}
.rec-table th{background:var(--sf2);color:var(--mt);font-family:'Passion One',sans-serif;font-weight:400;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;text-align:right;border-bottom:2px solid var(--am);white-space:nowrap;}
.rec-table th:first-child{text-align:left;}
.rec-table td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle;color:var(--mt);}
.rec-table td:first-child{text-align:left;color:#fff;font-weight:500;}
.rec-table tr:hover td{background:rgba(255,255,255,.03);}
.rec-table tr:hover td:first-child{color:var(--am);}
.rec-table .total-row td{border-top:2px solid var(--am);border-bottom:none;font-weight:700;padding-top:9px;}
.rec-table .total-row td:first-child{color:var(--am);}
.pct-bar-wrap{display:inline-flex;align-items:center;gap:5px;}
.pct-bar{background:var(--bd);border-radius:3px;height:5px;width:40px;overflow:hidden;display:inline-block;vertical-align:middle;}
.pct-bar-fill{height:100%;border-radius:3px;background:var(--vd);}
td.clickable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;}
td.clickable:hover{color:var(--am);}
</style>
</head>

// ─── MODAL RECETA ───
function openModal(nombre){
  const receta = RECETAS[nombre];
  if(!receta || !receta.length){ return; }
  // Buscar datos de precio y rentabilidad
  const prod = PRODS.find(p=>p.nombre===nombre) || {};
  const precio = prod.precio_civa || 0;
  const totalSiva = receta.reduce((s,i)=>s+i.costo_siva,0);
  const totalCiva = receta.reduce((s,i)=>s+i.costo_civa,0);
  const rentCiva = precio ? (precio - totalCiva) / precio : 0;

  document.getElementById('modal-nombre').textContent = nombre.toUpperCase();

  // KPIs
  document.getElementById('modal-kpis').innerHTML = `
    <div class="modal-kpi">
      <div class="modal-kv" style="color:#fff">${ar(precio)}</div>
      <div class="modal-kl">Precio</div>
    </div>
    <div class="modal-kpi">
      <div class="modal-kv" style="color:var(--vd)">${ar(totalCiva)}</div>
      <div class="modal-kl">Costo C/IVA</div>
    </div>
    <div class="modal-kpi">
      <div class="modal-kv" style="color:var(--am)">${pct(rentCiva)}</div>
      <div class="modal-kl">Rentabilidad</div>
    </div>`;

  // Tabla
  let rows = `<thead><tr>
    <th>Ingrediente</th>
    <th>Cantidad</th>
    <th>Unidad</th>
    <th>Costo S/IVA</th>
    <th>Costo C/IVA</th>
    <th>% Costo</th>
  </tr></thead><tbody>`;
  receta.forEach(i=>{
    const pctCosto = totalCiva > 0 ? i.costo_civa / totalCiva : 0;
    const barW = Math.min(pctCosto * 100, 100).toFixed(0);
    rows += `<tr>
      <td>${i.nombre}</td>
      <td style="color:#fff">${i.cantidad===Math.floor(i.cantidad)?i.cantidad.toFixed(0):i.cantidad}</td>
      <td>${i.unidad}</td>
      <td>${ar(i.costo_siva)}</td>
      <td style="color:#fff">${ar(i.costo_civa)}</td>
      <td>
        <div class="pct-bar-wrap">
          <div class="pct-bar"><div class="pct-bar-fill" style="width:${barW}%"></div></div>
          <span style="color:var(--vd);font-size:11px">${(pctCosto*100).toFixed(1)}%</span>
        </div>
      </td>
    </tr>`;
  });
  rows += `<tr class="total-row">
    <td>Total</td><td colspan="2"></td>
    <td>${ar(totalSiva)}</td>
    <td>${ar(totalCiva)}</td>
    <td style="color:var(--vd)">100%</td>
  </tr></tbody>`;
  document.getElementById('modal-table').innerHTML = rows;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

    tb += `<tr>
      <td${sinCosto?' style="color:#f87171"':''}>${p.nombre}${sinCosto?' <span style="font-size:9px;opacity:.6">(sin costo)</span>':""}</td>
      <td${sinCosto?' class="nm"':''}>${p.costo_siva?ar(p.costo_siva):'—'}</td>
      <td${sinCosto?' class="nm"':''}>${p.costo_civa?ar(p.costo_civa):'—'}</td>
      <td class="nm">${p.equiv_siva?'$'+p.equiv_siva.toFixed(2):'—'}</td>
      <td class="nm">${p.equiv_civa?'$'+p.equiv_civa.toFixed(2):'—'}</td>
    </tr>`;
  });
  t.innerHTML += tb + '</tbody>';
}
buildInsTable();

function showTab(id){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const tabs = ['local','py','ing'];
  document.querySelectorAll('.tab')[tabs.indexOf(id)].classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
}
</script>
